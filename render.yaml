services:
  - type: web
    name: aahar-ai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: AAHAR_DB
        value: /tmp/aahar.db
      - key: AAHAR_LLM_PROVIDER
        value: auto
      - key: AAHAR_EMERGENCY_NUMBER
        value: "112 / 999"
      - key: GOOGLE_CLIENT_ID
        value: 331358006720-5jkav09rk3gl5oc5pj8827boqnlmol7l.apps.googleusercontent.com
