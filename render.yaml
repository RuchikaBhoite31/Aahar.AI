services:
  - type: web
    name: aahar-ai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: AAHAR_DB
        value: /tmp/aahar.db
      - key: AAHAR_LLM_PROVIDER
        value: auto
      - key: AAHAR_EMERGENCY_NUMBER
        value: "112 / 999"
